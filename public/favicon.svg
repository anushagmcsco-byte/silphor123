<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07172B"/>
      <stop offset="50%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#040F1D"/>
    </linearGradient>
    <linearGradient id="tealCyan" x1="250" y1="55" x2="425" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00D2DF"/>
      <stop offset="100%" stop-color="#00828A"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="232" y1="260" x2="268" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00828A"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" stroke="#00828A" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Subtle circuit tech background accents -->
  <path d="M 44 256 L 100 256 L 140 216" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 468 256 L 412 256 L 372 296" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
  <circle cx="140" cy="216" r="5" fill="#38BDF8" fill-opacity="0.3"/>
  <circle cx="372" cy="296" r="5" fill="#00828A" fill-opacity="0.3"/>

  <!-- Centered SP Monogram & Circuit Emblem (Scaled and Centered) -->
  <g transform="translate(44, 126) scale(0.8)">
    <!-- LEFT CIRCUIT TRACES (Leading into 'S' - Bright Clean White) -->
    <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 60 120 L 120 120 L 160 160 L 210 160" />
      <circle cx="60" cy="120" r="10" fill="#FFFFFF" />

      <path d="M 50 160 L 150 160 L 175 185 L 215 185" />
      <circle cx="50" cy="160" r="10" fill="#FFFFFF" />

      <path d="M 90 200 L 160 200 L 190 200" />
      <circle cx="90" cy="200" r="10" fill="#FFFFFF" />
    </g>

    <!-- RIGHT CIRCUIT TRACES (Leading out of 'P' - Vivid Cyan/Teal) -->
    <g stroke="#00E5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 330 220 L 390 220 L 440 170 L 480 170" />
      <circle cx="480" cy="170" r="10" fill="#00E5FF" />

      <path d="M 330 240 L 400 240 L 430 205 L 465 205" />
      <circle cx="465" cy="205" r="10" fill="#00E5FF" />

      <path d="M 330 260 L 415 260 L 445 260" />
      <circle cx="445" cy="260" r="10" fill="#00E5FF" />
    </g>

    <!-- 'S' LETTERFORM - CRISP WHITE -->
    <path
      d="M 285 55 L 180 55 C 145 55 125 78 125 112 C 125 142 145 165 185 174 L 255 188 C 275 192 285 200 285 218 C 285 235 268 252 230 252 L 140 252 L 125 212 L 190 212 C 208 212 218 206 218 198 C 218 188 206 179 178 174 L 142 165 C 102 153 90 124 90 95 C 90 48 128 15 192 15 L 295 15 Z"
      fill="#FFFFFF"
    />

    <!-- 'P' LETTERFORM - GRADIENT CYAN / TEAL -->
    <path
      d="M 250 55 L 350 55 C 395 55 425 84 425 124 C 425 164 395 194 350 194 L 295 194 L 295 285 L 250 310 Z M 295 93 L 295 156 L 344 156 C 368 156 382 144 382 124 C 382 104 368 93 344 93 Z"
      fill="url(#tealCyan)"
    />

    <!-- SILICON IC CHIP (Center intersection below SP) -->
    <g stroke="#00E5FF" stroke-width="4" fill="none">
      <rect x="232" y="260" width="36" height="36" rx="5" stroke="#00E5FF" stroke-width="4" fill="#06182E" />
      <rect x="240" y="268" width="20" height="20" rx="3" fill="url(#chipGrad)" />
      
      <!-- Top pins -->
      <line x1="240" y1="260" x2="240" y2="252" stroke="#FFFFFF" stroke-width="3" />
      <line x1="250" y1="260" x2="250" y2="252" stroke="#FFFFFF" stroke-width="3" />
      <line x1="260" y1="260" x2="260" y2="252" stroke="#FFFFFF" stroke-width="3" />
      
      <!-- Bottom pins -->
      <line x1="240" y1="296" x2="240" y2="304" stroke="#00E5FF" stroke-width="3" />
      <line x1="250" y1="296" x2="250" y2="304" stroke="#00E5FF" stroke-width="3" />
      <line x1="260" y1="296" x2="260" y2="304" stroke="#00E5FF" stroke-width="3" />
      
      <!-- Left pins -->
      <line x1="232" y1="268" x2="224" y2="268" stroke="#FFFFFF" stroke-width="3" />
      <line x1="232" y1="278" x2="224" y2="278" stroke="#FFFFFF" stroke-width="3" />
      <line x1="232" y1="288" x2="224" y2="288" stroke="#FFFFFF" stroke-width="3" />
      
      <!-- Right pins -->
      <line x1="268" y1="268" x2="276" y2="268" stroke="#00E5FF" stroke-width="3" />
      <line x1="268" y1="278" x2="276" y2="278" stroke="#00E5FF" stroke-width="3" />
      <line x1="268" y1="288" x2="276" y2="288" stroke="#00E5FF" stroke-width="3" />
    </g>
  </g>
</svg>
